- aid: lunar:mcpx-gateway
  name: Lunar MCPX Gateway
  description: The Lunar MCPX Gateway is an agent-native Model Context Protocol gateway that governs tool
    invocation for AI agents. It consolidates multiple MCP servers into a single endpoint, providing authentication,
    scoped permissions, secret forwarding, audit trails, and risk evaluation for AI agent workloads. The
    MCPX gateway supports role-based access control, tool groups, tool customization, and remote MCP authentication.
  humanURL: https://www.lunar.dev/product/ai-gateway
  baseURL: https://app.lunar.dev
  tags:
